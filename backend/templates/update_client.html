{% extends 'base.html' %}

{% block title %}Update Client{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card">
        <h2 class="text-primary mb-lg text-center">Update Client</h2>
        
        <form id="update-client-form" onsubmit="updateClient(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="e.g. John Doe">
            </div>
            
            <div class="form-group">
                <label>Contact Preference</label>
                <select id="contact_preference">
                    <option value="Phone">Phone</option>
                    <option value="Email">Email</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" required placeholder="e.g. (555) 123-4567">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="e.g. john@example.com">
            </div>
            
            <div class="mt-lg flex justify-between items-center">
                <a href="{% url 'clients_list' %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submit-btn">Update Client</button>
            </div>
        </form>
        
        <p id="msg" class="text-center mt-md font-bold text-primary"></p>
    </div>
</div>

<script>
    const clientId = "{{ client_id }}";

    document.addEventListener("DOMContentLoaded", function() {
        // Load initial data
        fetch(`/users/api/clients/${clientId}/`)
            .then(response => response.json())
            .then(data => {
                if(data.error) {
                    alert(data.error);
                    window.location.href = "{% url 'clients_list' %}";
                    return;
                }
                document.getElementById('name').value = data.full_name;
                document.getElementById('contact_preference').value = data.contact_preference;
                document.getElementById('phone').value = data.phone;
                document.getElementById('email').value = data.email;
            })
            .catch(error => console.error('Error fetching client details:', error));
    });

    function updateClient(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = 'Updating...';
        
        const data = {
            name: document.getElementById('name').value,
            contact_preference: document.getElementById('contact_preference').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value
        };

        fetch(`/users/api/clients/update/${clientId}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('msg').innerText = data.message || 'Client updated successfully!';
            document.getElementById('msg').style.color = 'var(--color-primary)';
            
            setTimeout(() => {
                window.location.href = "{% url 'clients_list' %}";
            }, 1000);
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('msg').innerText = 'Error updating client.';
            document.getElementById('msg').style.color = 'red';
            btn.disabled = false;
            btn.innerText = 'Update Client';
        });
    }
</script>
{% endblock content %}
