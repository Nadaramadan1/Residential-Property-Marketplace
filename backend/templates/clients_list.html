{% extends 'base.html' %}

{% block title %}Clients List{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="flex justify-between items-center mb-lg">
            <h2 class="text-primary">Clients List</h2>
            <a href="{% url 'add_client' %}" class="btn btn-primary" style="display: flex; align-items: center; gap: 0.5rem;">
                <span class="material-symbols-outlined">add</span> Add New Client
            </a>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; min-width: 800px;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--color-outline-variant); text-align: left;">
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold;">ID</th>
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold;">Name</th>
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold;">Contact Preference</th>
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold;">Phone</th>
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold;">Email</th>
                        <th style="padding: 1rem; color: var(--color-on-surface-variant); font-weight: bold; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="clients-table-body">
                    <tr>
                        <td colspan="6" style="padding: 2rem; text-align: center; color: var(--color-on-surface-variant);">Loading clients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadClients();
    });

    function loadClients() {
        fetch('/users/api/clients/')
            .then(response => response.json())
            .then(data => renderClients(data))
            .catch(error => {
                console.error('Error fetching clients:', error);
                document.getElementById('clients-table-body').innerHTML = '<tr><td colspan="6" style="padding: 2rem; text-align: center; color: red;">Error loading clients.</td></tr>';
            });
    }

    function renderClients(clients) {
        const tbody = document.getElementById('clients-table-body');
        tbody.innerHTML = '';

        if (clients.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="padding: 2rem; text-align: center; color: var(--color-on-surface-variant);">No clients found.</td></tr>';
            return;
        }

        clients.forEach(client => {
            const tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid var(--color-outline-variant)';
            
            tr.innerHTML = `
                <td style="padding: 1rem;">${client.client_id}</td>
                <td style="padding: 1rem; font-weight: bold; color: var(--color-primary);">${client.full_name}</td>
                <td style="padding: 1rem;">
                    <span class="badge" style="background-color: var(--color-surface-container-high);">${client.contact_preference}</span>
                </td>
                <td style="padding: 1rem;">${client.phone}</td>
                <td style="padding: 1rem;">${client.email}</td>
                <td style="padding: 1rem; text-align: right;">
                    <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                        <a href="/users/updateClient/${client.client_id}/" class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">Edit</a>
                        <button onclick="deleteClient(${client.client_id})" class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.875rem; color: red; border-color: red;">Delete</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteClient(id) {
        if (!confirm('Are you sure you want to delete this client?')) return;

        fetch(`/users/api/clients/delete/${id}/`, {
            method: 'DELETE',
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message || 'Client deleted');
            loadClients();
        })
        .catch(error => console.error('Error deleting client:', error));
    }
</script>
{% endblock content %}
