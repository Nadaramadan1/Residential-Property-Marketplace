<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Representative</title>
</head>
<body>
<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" value="{{ representative.1 }}" placeholder="Name">
    <br><br>

    <input type="text" name="phone" value="{{ representative.2 }}" placeholder="Phone">
    <br><br>

    <input type="email" name="email" value="{{ representative.3 }}" placeholder="Email">
    <br><br>

    <input type="text" name="license_num" value="{{ representative.4 }}" placeholder="License number">
    <br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
