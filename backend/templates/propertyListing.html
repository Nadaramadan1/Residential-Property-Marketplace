{% extends 'base.html' %}

{% block title %}Property Listings{% endblock %}

{% block content %}
<div class="container">
    <div class="flex flex-col grid-cols-2 gap-lg" style="display: flex; flex-wrap: wrap;">
        <!-- Sidebar Filters -->
        <aside style="flex: 0 0 280px;">
            <div class="card" style="position: sticky; top: 100px;">
                <div class="flex justify-between items-center mb-lg">
                    <h2 class="text-primary">Filters</h2>
                    <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="loadProperties()">Clear All</button>
                </div>
                
                <div class="form-group">
                    <label>LOCATION</label>
                    <input type="text" id="filter-location" placeholder="City, Neighborhood">
                </div>
                
                <div class="form-group">
                    <label>PRICE RANGE</label>
                    <div class="flex gap-sm">
                        <input type="number" id="filter-min-price" placeholder="Min" style="width: 50%;">
                        <input type="number" id="filter-max-price" placeholder="Max" style="width: 50%;">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>PROPERTY STYLE</label>
                    <input type="text" id="filter-style" placeholder="e.g. Villa, Apartment">
                </div>
                
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="searchProperties()">Apply Filters</button>
                <a href="{% url 'add_page' %}" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem; text-align: center;">Add New Property</a>
            </div>
        </aside>

        <!-- Property Grid -->
        <section style="flex: 1;">
            <div class="flex justify-between items-center mb-md">
                <p class="text-on-surface-variant"><span id="property-count" style="font-weight: bold; color: var(--color-on-surface);">0</span> properties found</p>
                <div class="flex items-center gap-sm">
                    <span class="text-on-surface-variant" style="font-size: 0.875rem;">Sort by:</span>
                    <select id="sort-properties" style="padding: 0.25rem; font-weight: bold; border: none; background: transparent; cursor: pointer;">
                        <option>Newest First</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                    </select>
                </div>
            </div>

            <!-- Cards Grid (Populated by JS) -->
            <div class="grid grid-cols-1 grid-cols-2 gap-lg" id="properties-grid">
                <p class="text-on-surface-variant">Loading properties...</p>
            </div>
        </section>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadProperties();
    });

    function loadProperties() {
        fetch('/properties/list/')
            .then(response => response.json())
            .then(data => renderProperties(data))
            .catch(error => console.error('Error fetching properties:', error));
    }

    function searchProperties() {
        const location = document.getElementById('filter-location').value;
        const minPrice = document.getElementById('filter-min-price').value;
        const maxPrice = document.getElementById('filter-max-price').value;
        const style = document.getElementById('filter-style').value;

        // Build query string
        const params = new URLSearchParams();
        if (location) params.append('location', location);
        if (minPrice) params.append('min_price', minPrice);
        if (maxPrice) params.append('max_price', maxPrice);
        if (style) params.append('style', style);

        fetch(`/properties/search/?${params.toString()}`)
            .then(response => response.json())
            .then(data => renderProperties(data))
            .catch(error => console.error('Error searching properties:', error));
    }

    function renderProperties(properties) {
        const grid = document.getElementById('properties-grid');
        const count = document.getElementById('property-count');
        
        grid.innerHTML = '';
        count.textContent = properties.length;

        if (properties.length === 0) {
            grid.innerHTML = '<p class="text-on-surface-variant">No properties match your search.</p>';
            return;
        }

        properties.forEach(prop => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.padding = '0'; // Remove default card padding to allow image to span
            card.style.overflow = 'hidden';

            // Placeholder image since we don't have images in the DB currently
            const imageUrl = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCcnIex4ArFM-9bMWWROeYv2Xgi5eg3TZDhXMQTBf4eRvWg7n1n5pRshaPb4LRJONX6dOKB_pDkUA2Se0iYmnZy4MlFh7Uv3hpIzrAcvh62W5Suf0XiEj4PERixJyuX_ER0RR-XYN3SaiIUL8F-ZVAGHxNTAeD-5xqgWUG5iMNvCl5qyi_jYyOg6asGxOUkx-IOsxrv6McYMIRKVa1Xf7L1UA-9cEIlS5UcA-PXj1VZpeTtCdL4ILotGXpRfLAguol_a0cqS_OYRqxt';

            card.innerHTML = `
                <div style="height: 200px; overflow: hidden; position: relative;">
                    <img src="${imageUrl}" style="width: 100%; height: 100%; object-fit: cover;" alt="Property">
                    <div style="position: absolute; top: 1rem; left: 1rem;">
                        <span class="badge" style="background-color: var(--color-primary); color: white;">${prop.property_status}</span>
                    </div>
                </div>
                <div style="padding: var(--spacing-lg);">
                    <h3 class="text-primary mb-sm" style="font-size: 1.5rem;">$${prop.market_value.toLocaleString()}</h3>
                    <p class="text-on-surface-variant mb-md flex items-center gap-sm">
                        <span class="material-symbols-outlined" style="font-size: 18px;">location_on</span>
                        ${prop.address}
                    </p>
                    <div class="flex items-center gap-lg" style="border-top: 1px solid var(--color-outline-variant); padding-top: 1rem; margin-bottom: 1rem;">
                        <div class="flex items-center gap-sm text-on-surface-variant">
                            <span class="material-symbols-outlined">home</span>
                            <span style="font-weight: bold; font-size: 0.875rem;">${prop.style}</span>
                        </div>
                        <div class="flex items-center gap-sm text-on-surface-variant">
                            <span class="material-symbols-outlined">person</span>
                            <span style="font-weight: bold; font-size: 0.875rem;">Rep #${prop.representative_id}</span>
                        </div>
                    </div>
                    <div class="flex gap-sm">
                        <button class="btn btn-outline" style="flex: 1;" onclick="deleteProperty(${prop.property_id})">Delete</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function deleteProperty(propertyId) {
        if (!confirm('Are you sure you want to delete this property?')) return;

        fetch(`/properties/delete/${propertyId}/`, {
            method: 'DELETE',
            // CSRF token is exempt on the backend for delete_property according to properties/views.py
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            loadProperties(); // Refresh list
        })
        .catch(error => console.error('Error deleting property:', error));
    }
</script>
{% endblock content %}
