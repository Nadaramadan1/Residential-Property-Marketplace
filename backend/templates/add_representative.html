<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Representatives</title>
</head>
<body>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Representative Name">

    <input type="text" name="phone" placeholder="Phone">

    <input type="email" name="email" placeholder="Email">

    <input type="text" name="license_num" placeholder="License number">
    
    <button type="submit">Add Client</button>
</form>

</body>
</html>
