{% extends "base.html" %}
{% load static %}

{% block title %}Add Agreement – PrimeSquare{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create New Agreement</h1>
    <p><strong>Note:</strong> This will mark the property as SOLD.</p>
</div>

    <div id="message"></div>
    <form id="agreementForm" method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Client *</label>
            <select id="client_id" name="client_id" class="form-control" required>
                <option value="">Select Client</option>
                {% for client in clients %}
                    <option value="{{ client.0 }}" {% if pre_client == client.0|stringformat:"s" %}selected{% endif %}>{{ client.1 }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Property *</label>
            <select id="property_id" name="property_id" class="form-control" required>
                <option value="">Select Property (Available only)</option>
                {% for prop in properties %}
                    <option value="{{ prop.0 }}" {% if pre_prop == prop.0|stringformat:"s" %}selected{% endif %}>{{ prop.1 }} - {{ prop.2 }} ({{ prop.3 }} EGP)</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Final Price (EGP) *</label>
            <input type="number" id="final_price" name="final_price" step="0.01" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Effective Date *</label>
            <input type="date" id="effective_date" name="effective_date" class="form-control" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Agreement</button>
            <a href="{% url 'agreement_page' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('agreementForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            client_id: document.getElementById('client_id').value,
            property_id: document.getElementById('property_id').value,
            final_price: document.getElementById('final_price').value,
            effective_date: document.getElementById('effective_date').value
        };
        
        fetch('/api/agreements/add/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                const messageDiv = document.getElementById('message');
                messageDiv.innerHTML = `<div class="alert alert-success">${data.message} - Agreement ID: ${data.agree_id}</div>`;
                
                // Clear form
                document.getElementById('agreementForm').reset();
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = '{% url "agreement_page" %}';
                }, 1500);
            } else if (data.error) {
                document.getElementById('message').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('message').innerHTML = '<div class="alert alert-danger">Error adding agreement</div>';
        });
    });
</script>
{% endblock %}
